<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML5 Graphic</title>
</head>
<body>

    <h1>Marwadi University</h1>
    <h2>HTML Graphic Demonstration (SVG &amp; Canvas)</h2>

    <hr>

    <section>
        <h3>1. SVG Graphic (Vector Shapes)</h3>
        <p>SVG is used to draw scalable vector graphic directly in HTML:</p>
        <svg width="300" height="120">
            <rect width="120" height="80" fill="orange" />
            <circle cx="210" cy="40" r="35" fill="green" />
        </svg>
    </section>

    <section>
        <h3>HTML5 Canvas Graphic</h3>
        <p>Canvas is used to draw graphic dynamically using JavaScript:</p>
        <canvas id="myCanvas" width="300" height="120" style="border:1px solid #333;"></canvas>

        <script>
            //JavaScript to draw inside the canvas
            var canvas = document.getElementById("myCanvas");
            var ctx = canvas.getContext("2d");
            ctx.fillStyle = "blue";
            ctx.fillRect(20, 20, 140, 80);
        </script>
    </section>

    
</body>
</html>
