<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Iframes</title>
</head>
<body>

    <h1>Marwadi University</h1>
    <h2>HTML5 Iframe Demonstration</h2>

    <hr>

    <section>
        <h3>1. Embedding an External Webpage</h3>
        <p>The following webpage is loaded inside an inframe:</p>
        <iframe src="https://example.com" width="600" height="300" title="Example Website"></iframe>
    </section>

    <hr>

    <section>
        <h3>2. Embedding Google Map</h3>
        <p>Location representation using an iframe;</p>
        <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3684.167!2d70.802!3d22.303!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zMJLCsDE4JzExLJgiTiA3MMKwNDgnMDcuMiJF!5e0!3m2!1sen!2sin!4v1600000000000!5m2!1sen!2sin"
            width="600"
            height="300"
            style="border:9;"
            allowfullscreen=""
            loading="lazy"
            title="University Location">
        </iframe>
    </section>
    
</body>
</html>
