<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>

    <h1>Marwadi University</h1>
    <h2>Student Registration From</h2>

    <hr>

    <from action="#" method="POSt">


        <p>
            <label for="name">Full Name:</label><br>
            <input type="text" id="name" name="name" placeholder="Enter your full name" required>
        </p>

        <p>
            <label for="email">Email Address:</label><br>
            <input type="password" id="password" name="password" placeholder="Enter password" required>
        </p>

        <p>
            <label>Gender:</label><br>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
        </p>

        <p>
            <label for="dob">Date of Birth:</label><br>
            <input type="date" id="dob" name="dob">
        </p>

        <p>
            <label for="city">city:</label><br>
            <select id="city" name="city">
                <option value="">Select your city</option>
                <option value="Sri Ganganagar">Sri Ganganagar</option>
                <option value="Rajkot">Rajkot</option>
                <option value="Muzaffarnagar">Muzaffarnagar</option>
                <option value="Delhi">Delhi</option>
            </select>
        </p>
        
        <p>
            <lable for="coures">Coures:</lable><br>
            <select id="coures" name="coures">
                <option value="BCA">Bachelor of Computer Applications (BAC)</option>
                <option value="BSc">B.Sc. Information Technology</option>
            </select>
        </p>


        <p>
            <label>Hobbies:</label><br>
            <input type="checkbox" id="coding" name="hobbies" value="Coding">
            <label for="coding">Coding</label>
            <input type="checkbox" id="reading" name="hobbies" value="Reading">
            <label for="reading">Reading</label>
            <input type="checkbox" id="sports" name="hobbies" value="sports">
            <label for="sports">Sports</label>
        </p>

       

        <p>
            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="4" cols="30" placeholder="Enter your address"></textarea>
        </p>

        <p>
            <input type="submit" value="Register">
            <input type="reset" value="Clear">
        </p>

    </from>
    
</body>
</html>
